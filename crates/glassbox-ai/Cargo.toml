[package]
name = "glassbox-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["local-adapter"]
local-adapter = ["dep:ureq"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2.12", default-features = false, features = ["json"], optional = true }
tokio = { workspace = true, features = ["io-util", "process", "time"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "glassbox-provider-local"
path = "src/local.rs"
required-features = ["local-adapter"]
