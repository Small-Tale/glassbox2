name: Dependency audit
on:
  push:
    branches: [main]
    paths:
      - 'clients/web/package-lock.json'
      - 'Cargo.lock'
      - 'clients/web/src-tauri/Cargo.lock'
      - '.cargo/audit.toml'
      - 'clients/web/src-tauri/.cargo/audit.toml'
      - 'scripts/audit-dependencies.sh'
      - '.github/workflows/audit.yml'
  pull_request:
    paths:
      - 'clients/web/package-lock.json'
      - 'Cargo.lock'
      - 'clients/web/src-tauri/Cargo.lock'
      - '.cargo/audit.toml'
      - 'clients/web/src-tauri/.cargo/audit.toml'
      - 'scripts/audit-dependencies.sh'
      - '.github/workflows/audit.yml'
  # New advisories appear without any change here, so the lockfiles are also checked every week.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable install cargo-audit --locked
      - run: ./scripts/audit-dependencies.sh
