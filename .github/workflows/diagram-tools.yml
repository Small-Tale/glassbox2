name: Local diagram tools
on: workflow_dispatch

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install graphviz
      - if: runner.os == 'Windows'
        run: choco install graphviz --yes --no-progress
      - name: Render with installed engines
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          temporary_directory="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            temporary_directory="$(cygpath -au "$temporary_directory")"
          fi
          tools="$temporary_directory/glassbox-renderers"
          mkdir -p "$tools"
          npm install --prefix "$tools" --no-audit --no-fund @mermaid-js/mermaid-cli@11.12.0 playwright@1.65.1
          if [[ "$RUNNER_OS" == Linux ]]; then
            node "$tools/node_modules/playwright/cli.js" install --with-deps chromium
          else
            node "$tools/node_modules/playwright/cli.js" install chromium
          fi
          curl --fail-with-body --silent --show-error --location --max-time 90 \
            https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/1.2025.10/plantuml-1.2025.10.jar \
            -o "$tools/plantuml.jar"
          executable_suffix=""
          mermaid_suffix=""
          native_path() {
            if [[ "$RUNNER_OS" == Windows ]]; then
              cygpath -aw "$1"
            else
              printf '%s\n' "$1"
            fi
          }
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable_suffix=".exe"
            mermaid_suffix=".cmd"
            graphviz="$(command -v dot || printf '%s\n' '/c/Program Files/Graphviz/bin/dot.exe')"
          else
            graphviz="$(command -v dot)"
          fi
          export GLASSBOX_GRAPHVIZ_EXECUTABLE="$(native_path "$graphviz")"
          export GLASSBOX_MERMAID_EXECUTABLE="$(native_path "$tools/node_modules/.bin/mmdc$mermaid_suffix")"
          export GLASSBOX_JAVA_EXECUTABLE="$(native_path "$JAVA_HOME/bin/java$executable_suffix")"
          export GLASSBOX_PLANTUML_JAR="$(native_path "$tools/plantuml.jar")"
          export PUPPETEER_EXECUTABLE_PATH="$(node -p 'require(process.argv[1]).chromium.executablePath()' "$tools/node_modules/playwright")"
          cargo +stable test --locked -p glassbox-render-local renders_real_tools --quiet -- --ignored
