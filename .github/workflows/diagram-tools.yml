name: Local diagram tools
on: workflow_dispatch

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: rustup toolchain install stable --profile minimal
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install graphviz
      - if: runner.os == 'Windows'
        run: choco install graphviz --yes --no-progress
      - name: Render with installed engines
        shell: bash
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          temporary_directory="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == Windows ]]; then
            temporary_directory="$(cygpath -au "$temporary_directory")"
          fi
          tools="$temporary_directory/glassbox-renderers"
          mkdir -p "$tools"
          npm install --prefix "$tools" --no-audit --no-fund @mermaid-js/mermaid-cli@11.12.0 playwright@1.65.1
          if [[ "$RUNNER_OS" != Windows ]]; then
            export PLAYWRIGHT_BROWSERS_PATH="$tools/browsers"
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            node "$tools/node_modules/playwright/cli.js" install --with-deps --only-shell chromium
          elif [[ "$RUNNER_OS" == macOS ]]; then
            node "$tools/node_modules/playwright/cli.js" install --only-shell chromium
          else
            node "$tools/node_modules/playwright/cli.js" install chromium
          fi
          curl --fail-with-body --silent --show-error --location --max-time 90 \
            https://repo.maven.apache.org/maven2/net/sourceforge/plantuml/plantuml/1.2025.10/plantuml-1.2025.10.jar \
            -o "$tools/plantuml.jar"
          executable_suffix=""
          mermaid_suffix=""
          native_path() {
            if [[ "$RUNNER_OS" == Windows ]]; then
              cygpath -aw "$1"
            else
              printf '%s\n' "$1"
            fi
          }
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable_suffix=".exe"
            mermaid_suffix=".cmd"
            graphviz="$(command -v dot || printf '%s\n' '/c/Program Files/Graphviz/bin/dot.exe')"
          else
            graphviz="$(command -v dot)"
          fi
          mermaid="$tools/node_modules/.bin/mmdc$mermaid_suffix"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # This profile applies only to the fixed diagram fixtures on the hosted runner.
            printf '%s\n' '{"args":["--no-sandbox"]}' > "$tools/puppeteer-smoke.json"
            cat > "$tools/mmdc-smoke" <<'SH'
          #!/usr/bin/env bash
          tools="$(dirname "$0")"
          exec "$tools/node_modules/.bin/mmdc" "$@" -p "$tools/puppeteer-smoke.json"
          SH
            chmod +x "$tools/mmdc-smoke"
            mermaid="$tools/mmdc-smoke"
          fi
          export GLASSBOX_GRAPHVIZ_EXECUTABLE="$(native_path "$graphviz")"
          export GLASSBOX_MERMAID_EXECUTABLE="$(native_path "$mermaid")"
          export GLASSBOX_JAVA_EXECUTABLE="$(native_path "$JAVA_HOME/bin/java$executable_suffix")"
          export GLASSBOX_PLANTUML_JAR="$(native_path "$tools/plantuml.jar")"
          if [[ "$RUNNER_OS" == Windows ]]; then
            browser="$(node -p 'require(process.argv[1]).chromium.executablePath()' "$tools/node_modules/playwright")"
          else
            browser="$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome-headless-shell -print -quit)"
            test -x "$browser"
          fi
          export PUPPETEER_EXECUTABLE_PATH="$browser"
          if ! cargo +stable test --locked -p glassbox-render-local renders_real_tools --quiet -- --ignored; then
            if [[ "$RUNNER_OS" != Windows ]]; then
              printf 'flowchart TD\nA --> B\n' > "$tools/diagnostic.mmd"
              "$mermaid" -i "$tools/diagnostic.mmd" -o "$tools/diagnostic.svg" || true
            fi
            exit 1
          fi
