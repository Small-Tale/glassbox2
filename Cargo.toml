[workspace]
resolver = "3"
members = [
    "crates/glassbox-cli",
    "crates/glassbox-comparison",
    "crates/glassbox-model",
    "crates/glassbox-server",
    "crates/glassbox-settings",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
glassbox-model = { path = "crates/glassbox-model" }
glassbox-settings = { path = "crates/glassbox-settings" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
